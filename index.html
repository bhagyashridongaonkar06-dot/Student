<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 student crud using firebase and generic function</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <h1 class="bg-warning text-center text-white p-2">Student crud 1 using firebase and generic function</h1>
    <div class="container-fluid mt-5">
        <div class="row">
            <div class="col-md-5">
                <div class="card">
                    <form action="" id="studForm">
                        <div class="card-header bg-info">
                            <h4 class="text-white text-center">Student Form</h4>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="fname">First Name<span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fname">
                            </div>

                            <div class="form-group">
                                <label for="lname">Last Name<span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="lname">
                            </div>

                            <div class="form-group">
                                <label for="email">Email<span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="email">
                            </div>

                            <div class="form-group">
                                <label for="contact">Contact<span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="contact">
                            </div>
                        </div>

                        <div class="card-footer bg-info">
                            <button type="submit" class="btn btn-sm btn-block btn-warning text-white" id="addStd">Add Student</button>
                            <button type="button" class="btn btn-sm btn-block btn-success d-none text-white" id="updateStd">Update Student</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card bg-info">
                    <div class="card-body table-responsive">
                        <table class="table table-bordered table-hover bg-white">
                            <thead>
                                <tr>
                                    <th>Sr No</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Email Address</th>
                                    <th>Contact</th>
                                    <th>Edit</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>

                            <tbody id="stdList">
                                <!-- <tr>
                                    <td>1</td>
                                    <td>Jhon</td>
                                    <td>Doe</td>
                                    <td>jd@gmail.com</td>
                                    <td>89575637</td>
                                    <td><button class="btn btn-success"><i
                                                class="fa-solid fa-pen-to-square fa-2x"></i></button></td>
                                    <td><button class="btn btn-danger"><i class="fa-solid fa-trash fa-2x"></i></button></td>
                                </tr> -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
